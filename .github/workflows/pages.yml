# Builds the AngryRobot frontend (frontend/: landing + operator console, built on the
# "Angry Robots logo rework" design system) and deploys it to GitHub Pages.
#
# The console talks to the AngryRobot service from the browser. Point it elsewhere with the
# repository variable VITE_ANGRYROBOT_API (Settings → Secrets and variables → Actions → Variables);
# the service must list this Pages origin in ANGRYROBOT_CORS_ORIGINS. No secret is ever built in:
# operators paste the shared secret in the console, and it stays in their browser tab.
#
# The previous PhoneFlow-fork app (angryrobots/apps/app) is no longer deployed here; its code is untouched.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build frontend
        env:
          # Project sites are served from /<repo>/; a *.github.io repo is served from /.
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_ANGRYROBOT_API: ${{ vars.VITE_ANGRYROBOT_API || 'https://hackspainteam.onrender.com' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
