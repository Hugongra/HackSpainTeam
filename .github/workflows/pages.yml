# Builds the AngryRobots (PhoneFlow fork) frontend (angryrobots/apps/app) and deploys it to GitHub Pages.
#
# One-time setup (needs repo admin): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then set a repository variable VITE_API_URL pointing
# at wherever the backend runs (Settings → Secrets and variables → Actions → Variables).
name: pages

on:
  push:
    branches: [main]
    paths:
      - "angryrobots/apps/app/**"
      - "angryrobots/packages/ui/**"
      - "angryrobots/packages/shared/**"
      - "angryrobots/pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angryrobots
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: angryrobots/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: angryrobots/apps/app
        env:
          # Project sites are served from /<repo>/; a *.github.io repo is served from /.
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_FRONTEND_URL: ${{ vars.VITE_FRONTEND_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          VITE_PUBLIC_S3_URL: ${{ vars.VITE_PUBLIC_S3_URL }}
          VITE_LIVEKIT_AGENT_NAME: ${{ vars.VITE_LIVEKIT_AGENT_NAME || 'voice-agent' }}
        run: |
          pnpm build --base="$BASE_PATH"
          cp dist/index.html dist/404.html   # SPA fallback for client-side routes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: angryrobots/apps/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
